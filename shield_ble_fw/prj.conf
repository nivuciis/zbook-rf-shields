CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CRC=y

# A placa liga o log em modo deferred, que imprime numa thread de baixa
# prioridade; como o gravador fica em polling, o printk nunca sairia.
CONFIG_LOG_MODE_IMMEDIATE=y

# CRC do ultimo firmware gravado no CH592, em /lfs (LittleFS da placa)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_MAIN_STACK_SIZE=4096

# Linhas digitadas no console (uart0) sao enviadas ao celular
CONFIG_CONSOLE_SUBSYS=y
CONFIG_CONSOLE_GETLINE=y
