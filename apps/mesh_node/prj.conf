# The RFM95W is driven directly over SPI by src/radio.c, so the Zephyr LoRa
# driver (enabled by default by the zbook_lora shield) is left out.
CONFIG_LORA=n
CONFIG_SPI=y
CONFIG_GPIO=y

# Chip unique ID -> Meshtastic node number
CONFIG_HWINFO=y

# Interactive console on the PROG USB serial port
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=320
CONFIG_SHELL_ARGC_MAX=40

# Logs go through the shell
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_MAIN_STACK_SIZE=2048

# Periodic NODEINFO/position sends build and encrypt packets on the system workqueue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# OLED user interface: SSD1306 on i2c0, BTN0..BTN3 and the rotary encoder
CONFIG_I2C=y
CONFIG_DISPLAY=y
CONFIG_INPUT=y

# Piezo buzzer (pwm-buzzer alias, GPIO32)
CONFIG_PWM=y

# zbus: input and mesh events to the UI (message subscriber, static buffers)
CONFIG_ZBUS=y
CONFIG_ZBUS_MSG_SUBSCRIBER=y
CONFIG_ZBUS_MSG_SUBSCRIBER_BUF_ALLOC_STATIC=y
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_STATIC_DATA_SIZE=256
CONFIG_ZBUS_MSG_SUBSCRIBER_NET_BUF_POOL_SIZE=16
