# The RFM95W is driven directly over SPI by src/radio.c, so the Zephyr LoRa
# driver (enabled by default by the zbook_lora shield) is left out.
CONFIG_LORA=n
CONFIG_SPI=y
CONFIG_GPIO=y

# Chip unique ID -> Meshtastic node number
CONFIG_HWINFO=y

# Interactive console on the PROG USB serial port
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_CMD_BUFF_SIZE=320
CONFIG_SHELL_ARGC_MAX=40

# Logs go through the shell
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_MAIN_STACK_SIZE=2048
