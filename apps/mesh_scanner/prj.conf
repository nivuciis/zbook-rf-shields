# The RFM95W is driven directly over SPI (polling, no DIO0), so the Zephyr
# LoRa driver enabled by default by the zbook_lora shield is left out.
CONFIG_LORA=n
CONFIG_SPI=y
CONFIG_GPIO=y

# Interactive console on the PROG USB serial port
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_GPIO_SHELL=y

# Logs go through the shell
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096

CONFIG_MAIN_STACK_SIZE=2048
